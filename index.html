<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>음주 카운터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 4px 5px 6px 5px;
      gap: 5px;
    }

    /* 1. 상단 상태 카드 2열 */
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      height: 38%;
    }

    .card {
      background: #1c1c1e;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2px;
      text-align: center;
    }

    .card-label {
      font-size: 12px;
      font-weight: 600;
      color: #b0b0b5;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    .card-value {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.1;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .card-sub {
      font-size: 11px;
      font-weight: 700;
      color: #30d158;
      margin-top: 2px;
    }

    /* 2. 메인 추가 버튼 영역 */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      height: 38%;
    }

    button {
      border: none;
      border-radius: 14px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      letter-spacing: -0.3px;
    }

    button:active {
      opacity: 0.75;
      transform: scale(0.95);
    }

    .btn-soju {
      background-color: #28cd41;
      color: #000000;
      font-size: 18px;
    }

    .btn-somaek {
      background-color: #ff9f0a;
      color: #000000;
      font-size: 18px;
    }

    /* 3. 하단 취소 및 초기화 버튼 */
    .bottom-row {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 5px;
      height: 20%;
    }

    .btn-undo {
      background-color: #2c2c2e;
      color: #ffffff;
      font-size: 14px;
    }

    .btn-reset {
      background-color: #3a1c1c;
      color: #ff453a;
      font-size: 14px;
    }

    /* 풀스크린 클릭 피드백 오버레이 */
    #feedbackOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease-out;
    }

    #feedbackOverlay.show {
      opacity: 1;
    }

    .overlay-soju {
      background-color: rgba(40, 205, 65, 0.97);
      color: #000000;
    }

    .overlay-somaek {
      background-color: rgba(255, 159, 10, 0.97);
      color: #000000;
    }

    .overlay-undo {
      background-color: rgba(58, 58, 60, 0.97);
      color: #ffffff;
    }

    .overlay-reset {
      background-color: rgba(255, 69, 58, 0.97);
      color: #ffffff;
    }

    .overlay-icon {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 8px;
      animation: popScale 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .overlay-text {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    @keyframes popScale {
      0% { transform: scale(0.5); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1.0); }
    }
  </style>
</head>
<body>
  <div id="feedbackOverlay">
    <div class="overlay-icon" id="overlayIcon">🍶</div>
    <div class="overlay-text" id="overlayText">소주 1잔!</div>
  </div>

  <div class="container">
    <!-- 1. 상단 정보 표시 -->
    <div class="status-grid">
      <div class="card">
        <div class="card-label">남은 소주</div>
        <div class="card-value" id="remainSoju">17잔</div>
        <div class="card-sub" id="drinkCountText">소0 · 맥0</div>
      </div>
      <div class="card">
        <div class="card-label">누적 병수</div>
        <div class="card-value" id="totalBottles">0.0병</div>
        <div class="card-sub" id="totalAlcohol">0g</div>
      </div>
    </div>

    <!-- 2. 메인 추가 버튼 -->
    <div class="btn-row">
      <button class="btn-soju" onclick="addDrink('soju')">+1 소주</button>
      <button class="btn-somaek" onclick="addDrink('somaek')">+1 소맥</button>
    </div>

    <!-- 3. 직전 취소 & 전체 리셋 -->
    <div class="bottom-row">
      <button class="btn-undo" onclick="undoLast()">취소 (-1)</button>
      <button class="btn-reset" onclick="resetAll()">초기화</button>
    </div>
  </div>

  <script>
    const MAX_ALCOHOL_UNITS = 17.0;
    const SOMAEK_TO_SOJU_RATIO = 1.3;

    let history = [];
    let overlayTimer = null;

    function showFeedback(type, icon, text) {
      const overlay = document.getElementById('feedbackOverlay');
      const iconEl = document.getElementById('overlayIcon');
      const textEl = document.getElementById('overlayText');

      if (overlayTimer) clearTimeout(overlayTimer);

      overlay.className = `overlay-${type}`;
      iconEl.innerText = icon;
      textEl.innerText = text;

      iconEl.style.animation = 'none';
      iconEl.offsetHeight;
      iconEl.style.animation = null;

      overlay.classList.add('show');

      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      overlayTimer = setTimeout(() => {
        overlay.classList.remove('show');
      }, 450);
    }

    function addDrink(type) {
      history.push(type);
      updateUI();

      if (type === 'soju') {
        const count = history.filter(i => i === 'soju').length;
        showFeedback('soju', '🍶', `소주 ${count}잔째!`);
      } else {
        const count = history.filter(i => i === 'somaek').length;
        showFeedback('somaek', '🍺', `소맥 ${count}잔째!`);
      }
    }

    function undoLast() {
      if (history.length > 0) {
        const removed = history.pop();
        updateUI();
        const label = removed === 'soju' ? '소주' : '소맥';
        showFeedback('undo', '↩️', `${label} 취소`);
      }
    }

    function resetAll() {
      if (history.length === 0) return;
      history = [];
      updateUI();
      showFeedback('reset', '🔄', '초기화 완료');
    }

    function updateUI() {
      const sojuCount = history.filter(item => item === 'soju').length;
      const somaekCount = history.filter(item => item === 'somaek').length;

      const usedUnits = (sojuCount * 1.0) + (somaekCount * SOMAEK_TO_SOJU_RATIO);
      const remainSoju = Math.max(0, Math.floor(MAX_ALCOHOL_UNITS - usedUnits));

      const bottles = (usedUnits * (2.5 / 17)).toFixed(2);
      const pureAlcoholGrams = Math.round(bottles * 57.6);

      document.getElementById('remainSoju').innerText = `${remainSoju}잔`;
      document.getElementById('drinkCountText').innerText = `소${sojuCount} · 맥${somaekCount}`;
      document.getElementById('totalBottles').innerText = `${bottles}병`;
      document.getElementById('totalAlcohol').innerText = `${pureAlcoholGrams}g`;

      const remainEl = document.getElementById('remainSoju');
      if (remainSoju === 0) {
        remainEl.style.color = '#ff453a';
      } else if (remainSoju <= 4) {
        remainEl.style.color = '#ff9f0a';
      } else {
        remainEl.style.color = '#ffffff';
      }
    }

    updateUI();
  </script>
</body>
</html>

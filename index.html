<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>음주 카운터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 4px 6px 8px 6px;
      gap: 4px;
    }

    /* 상단 상태 카드 2열 */
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      height: 36%;
    }

    .card {
      background: #1c1c1e;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2px 4px;
      text-align: center;
    }

    .card-label {
      font-size: 9px;
      color: #a1a1a6;
      line-height: 1.1;
      margin-bottom: 2px;
      word-break: keep-all;
    }

    .card-value {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .card-sub {
      font-size: 9px;
      color: #30d158;
      margin-top: 1px;
    }

    /* 메인 추가 버튼 영역 */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      height: 38%;
    }

    button {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    button:active {
      opacity: 0.75;
      transform: scale(0.95);
    }

    .btn-soju {
      background-color: #28cd41;
      color: #000000;
      font-size: 13px;
    }

    .btn-somaek {
      background-color: #ff9f0a;
      color: #000000;
      font-size: 13px;
    }

    .btn-sub {
      font-size: 9px;
      font-weight: 600;
      opacity: 0.85;
      margin-top: 1px;
    }

    /* 하단 취소 및 초기화 버튼 */
    .bottom-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 4px;
      height: 22%;
    }

    .btn-undo {
      background-color: #2c2c2e;
      color: #ffffff;
      font-size: 11px;
    }

    .btn-reset {
      background-color: #3a1c1c;
      color: #ff453a;
      font-size: 11px;
    }

    /* 풀스크린 클릭 피드백 오버레이 */
    #feedbackOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease-out;
    }

    #feedbackOverlay.show {
      opacity: 1;
    }

    .overlay-soju {
      background-color: rgba(40, 205, 65, 0.96);
      color: #000000;
    }

    .overlay-somaek {
      background-color: rgba(255, 159, 10, 0.96);
      color: #000000;
    }

    .overlay-undo {
      background-color: rgba(58, 58, 60, 0.96);
      color: #ffffff;
    }

    .overlay-reset {
      background-color: rgba(255, 69, 58, 0.96);
      color: #ffffff;
    }

    .overlay-icon {
      font-size: 54px;
      line-height: 1;
      margin-bottom: 6px;
      animation: popScale 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .overlay-text {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    @keyframes popScale {
      0% { transform: scale(0.5); }
      70% { transform: scale(1.15); }
      100% { transform: scale(1.0); }
    }
  </style>
</head>
<body>
  <!-- 클릭 시 화면 전체를 덮는 알림 레이어 -->
  <div id="feedbackOverlay">
    <div class="overlay-icon" id="overlayIcon">🍶</div>
    <div class="overlay-text" id="overlayText">소주 +1잔!</div>
  </div>

  <div class="container">
    <!-- 1. 상단 정보 표시 -->
    <div class="status-grid">
      <div class="card">
        <div class="card-label">남은 소주 허용치</div>
        <div class="card-value" id="remainSoju">17잔</div>
        <div class="card-sub" id="drinkCountText">소주 0 · 소맥 0</div>
      </div>
      <div class="card">
        <div class="card-label">누적 알코올</div>
        <div class="card-value" id="totalBottles">0.00 병</div>
        <div class="card-sub" id="totalAlcohol">알코올 약 0g</div>
      </div>
    </div>

    <!-- 2. 메인 추가 버튼 (소주 / 소맥) -->
    <div class="btn-row">
      <button class="btn-soju" onclick="addDrink('soju')">
        <span>+1 소주</span>
        <span class="btn-sub">3/4잔</span>
      </button>
      <button class="btn-somaek" onclick="addDrink('somaek')">
        <span>+1 소맥</span>
        <span class="btn-sub">제한없음</span>
      </button>
    </div>

    <!-- 3. 직전 취소 & 전체 리셋 -->
    <div class="bottom-row">
      <button class="btn-undo" onclick="undoLast()">직전 1잔 취소 (-1)</button>
      <button class="btn-reset" onclick="resetAll()">초기화</button>
    </div>
  </div>

  <script>
    const MAX_ALCOHOL_UNITS = 17.0;
    const SOMAEK_TO_SOJU_RATIO = 1.3;

    let history = [];
    let overlayTimer = null;

    function showFeedback(type, icon, text) {
      const overlay = document.getElementById('feedbackOverlay');
      const iconEl = document.getElementById('overlayIcon');
      const textEl = document.getElementById('overlayText');

      // 이전 타이머 초기화 (연속 클릭 대응)
      if (overlayTimer) clearTimeout(overlayTimer);

      overlay.className = `overlay-${type}`;
      iconEl.innerText = icon;
      textEl.innerText = text;

      // 애니메이션 재실행 트릭
      iconEl.style.animation = 'none';
      iconEl.offsetHeight; 
      iconEl.style.animation = null;

      overlay.classList.add('show');

      // 진동 지원 기기일 경우 짧은 진동 추가
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      overlayTimer = setTimeout(() => {
        overlay.classList.remove('show');
      }, 450);
    }

    function addDrink(type) {
      history.push(type);
      updateUI();

      if (type === 'soju') {
        const count = history.filter(i => i === 'soju').length;
        showFeedback('soju', '🍶', `소주 ${count}잔째!`);
      } else {
        const count = history.filter(i => i === 'somaek').length;
        showFeedback('somaek', '🍺', `소맥 ${count}잔째!`);
      }
    }

    function undoLast() {
      if (history.length > 0) {
        const removed = history.pop();
        updateUI();
        const label = removed === 'soju' ? '소주' : '소맥';
        showFeedback('undo', '↩️', `${label} 1잔 취소`);
      }
    }

    function resetAll() {
      if (history.length === 0) return;
      history = [];
      updateUI();
      showFeedback('reset', '🔄', '기록 초기화');
    }

    function updateUI() {
      const sojuCount = history.filter(item => item === 'soju').length;
      const somaekCount = history.filter(item => item === 'somaek').length;

      const usedUnits = (sojuCount * 1.0) + (somaekCount * SOMAEK_TO_SOJU_RATIO);
      const remainSoju = Math.max(0, Math.floor(MAX_ALCOHOL_UNITS - usedUnits));

      const bottles = (usedUnits * (2.5 / 17)).toFixed(2);
      const pureAlcoholGrams = Math.round(bottles * 57.6);

      document.getElementById('remainSoju').innerText = `${remainSoju}잔`;
      document.getElementById('drinkCountText').innerText = `소주 ${sojuCount} · 소맥 ${somaekCount}`;
      document.getElementById('totalBottles').innerText = `${bottles} 병`;
      document.getElementById('totalAlcohol').innerText = `알코올 약 ${pureAlcoholGrams}g`;

      const remainEl = document.getElementById('remainSoju');
      if (remainSoju === 0) {
        remainEl.style.color = '#ff453a';
      } else if (remainSoju <= 4) {
        remainEl.style.color = '#ff9f0a';
      } else {
        remainEl.style.color = '#ffffff';
      }
    }

    updateUI();
  </script>
</body>
</html>

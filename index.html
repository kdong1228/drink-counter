<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 애플워치 화면 확대/스크롤 방지 및 웹앱 모드 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>음주 카운터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 전체 화면 고정 (스크롤 원천 차단) */
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }

    /* 상단 X 버튼 영역을 피해 한 화면에 쏙 들어오도록 압축 배치 */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 4px 6px 8px 6px;
      gap: 4px;
    }

    /* 상단 상태 카드 2열 */
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      height: 36%;
    }

    .card {
      background: #1c1c1e;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2px 4px;
      text-align: center;
    }

    .card-label {
      font-size: 9px;
      color: #a1a1a6;
      line-height: 1.1;
      margin-bottom: 2px;
      word-break: keep-all;
    }

    .card-value {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .card-sub {
      font-size: 9px;
      color: #30d158;
      margin-top: 1px;
    }

    /* 추가 버튼 영역 (소주 / 소맥 나란히 배치해 높이 절약) */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      height: 38%;
    }

    button {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    button:active {
      opacity: 0.75;
      transform: scale(0.97);
    }

    .btn-soju {
      background-color: #28cd41;
      color: #000000;
      font-size: 13px;
    }

    .btn-somaek {
      background-color: #ff9f0a;
      color: #000000;
      font-size: 13px;
    }

    .btn-sub {
      font-size: 9px;
      font-weight: 600;
      opacity: 0.8;
      margin-top: 1px;
    }

    /* 하단 취소 및 초기화 버튼 */
    .bottom-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 4px;
      height: 22%;
    }

    .btn-undo {
      background-color: #2c2c2e;
      color: #ffffff;
      font-size: 11px;
    }

    .btn-reset {
      background-color: #3a1c1c;
      color: #ff453a;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 1. 상단 정보 표시 -->
    <div class="status-grid">
      <div class="card">
        <div class="card-label">남은 소주 허용치</div>
        <div class="card-value" id="remainSoju">17잔</div>
        <div class="card-sub" id="drinkCountText">소주 0 · 소맥 0</div>
      </div>
      <div class="card">
        <div class="card-label">누적 알코올</div>
        <div class="card-value" id="totalBottles">0.00 병</div>
        <div class="card-sub" id="totalAlcohol">순수알코올 0g</div>
      </div>
    </div>

    <!-- 2. 메인 추가 버튼 (소주 / 소맥) -->
    <div class="btn-row">
      <button class="btn-soju" onclick="addDrink('soju')">
        <span>+1 소주</span>
        <span class="btn-sub">3/4잔</span>
      </button>
      <button class="btn-somaek" onclick="addDrink('somaek')">
        <span>+1 소맥</span>
        <span class="btn-sub">제한없음</span>
      </button>
    </div>

    <!-- 3. 직전 취소 & 전체 리셋 -->
    <div class="bottom-row">
      <button class="btn-undo" onclick="undoLast()">직전 1잔 취소 (-1)</button>
      <button class="btn-reset" onclick="resetAll()">초기화</button>
    </div>
  </div>

  <script>
    // 기준 설정 (기존 최대 17잔 = 소주 약 2.5병 분량 기준)
    const MAX_ALCOHOL_UNITS = 17.0; // 소주 1잔(3/4잔 기준) = 1.0 유닛
    
    // 소맥 1잔당 소주 대비 알코올 환산 비율 (예: 소맥 1잔 = 소주 1.3잔 분량)
    // 필요에 따라 1.2 ~ 1.5 사이로 조절 가능
    const SOMAEK_TO_SOJU_RATIO = 1.3; 

    let history = []; // 'soju' 또는 'somaek' 기록 배열

    function addDrink(type) {
      history.push(type);
      updateUI();
    }

    function undoLast() {
      if (history.length > 0) {
        history.pop();
        updateUI();
      }
    }

    function resetAll() {
      if (history.length === 0) return;
      history = [];
      updateUI();
    }

    function updateUI() {
      const sojuCount = history.filter(item => item === 'soju').length;
      const somaekCount = history.filter(item => item === 'somaek').length;

      // 총 소모 유닛 계산 (소맥을 마실수록 남은 소주 허용치가 자동으로 줄어듦)
      const usedUnits = (sojuCount * 1.0) + (somaekCount * SOMAEK_TO_SOJU_RATIO);
      const remainSoju = Math.max(0, Math.floor(MAX_ALCOHOL_UNITS - usedUnits));

      // 소주 병 수 환산 (기존 화면 기준: 17잔 ≈ 2.5병 -> 1유닛당 약 0.147병)
      const bottles = (usedUnits * (2.5 / 17)).toFixed(2);
      // 순수 알코올(g) 환산 (소주 1병 ≈ 57.6g 기준)
      const pureAlcoholGrams = Math.round(bottles * 57.6);

      document.getElementById('remainSoju').innerText = `${remainSoju}잔`;
      document.getElementById('drinkCountText').innerText = `소주 ${sojuCount} · 소맥 ${somaekCount}`;
      document.getElementById('totalBottles').innerText = `${bottles} 병`;
      document.getElementById('totalAlcohol').innerText = `알코올 약 ${pureAlcoholGrams}g`;

      // 허용치 초과 시 경고 색상 변경
      const remainEl = document.getElementById('remainSoju');
      if (remainSoju === 0) {
        remainEl.style.color = '#ff453a';
      } else if (remainSoju <= 4) {
        remainEl.style.color = '#ff9f0a';
      } else {
        remainEl.style.color = '#ffffff';
      }
    }

    updateUI();
  </script>
</body>
</html>
